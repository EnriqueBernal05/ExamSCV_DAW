<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de dos números</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .content {
            display: inline-block;
            text-align: left;
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
        }
        input[type="button"] {
            margin-top: 5px;
            margin-right: 5px;
            padding: 5px 10px;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Calculadora de dos números</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2">
            </div>

            <!-- Botones de operaciones -->
            <input type="button" value="Calcular suma" style="background-color: green;" onclick="calcularSuma()">
            <input type="button" value="Calcular resta" style="background-color: red;" onclick="calcularResta()">
            <input type="button" value="Calcular multiplicación" style="background-color: blue;" onclick="calcularMultiplicacion()">
            <input type="button" value="Calcular división" style="background-color: orange;" onclick="calcularDivision()">
        </form>

        <div id="resultado" style="margin-top: 20px; font-weight: bold;"></div>
    </div>
</div>

<script>
// Función suma
function calcularSuma() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    if (!isNaN(num1) && !isNaN(num2)) {
        var resultado = num1 + num2;
        document.getElementById("resultado").innerHTML = "El resultado de la suma es: " + resultado;
    } else {
        document.getElementById("resultado").innerHTML = "Por favor, ingrese dos números válidos.";
    }
}

// Función resta
function calcularResta() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    if (!isNaN(num1) && !isNaN(num2)) {
        var resultado = num1 - num2;
        document.getElementById("resultado").innerHTML = "El resultado de la resta es: " + resultado;
    } else {
        document.getElementById("resultado").innerHTML = "Por favor, ingrese dos números válidos.";
    }
}

// Función multiplicación
function calcularMultiplicacion() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    if (!isNaN(num1) && !isNaN(num2)) {
        var resultado = num1 * num2;
        document.getElementById("resultado").innerHTML = "El resultado de la multiplicación es: " + resultado;
    } else {
        document.getElementById("resultado").innerHTML = "Por favor, ingrese dos números válidos.";
    }
}

// Función división
function calcularDivision() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    if (!isNaN(num1) && !isNaN(num2)) {
        if(num2 !== 0) {
            var resultado = num1 / num2;
            document.getElementById("resultado").innerHTML = "El resultado de la división es: " + resultado;
        } else {
            document.getElementById("resultado").innerHTML = "No se puede dividir entre cero.";
        }
    } else {
        document.getElementById("resultado").innerHTML = "Por favor, ingrese dos números válidos.";
    }
}
</script>

</body>
</html>
